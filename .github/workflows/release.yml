# Builds the Ubuntu 24.04 / Python 3.12 / amd64 bundle (scripts/bundle/build-bundle.sh), runs the fork test
# suites against the venv the bundle installs (make test-bundle) and the offline install test, and attaches the
# bundle: as a workflow artifact on every run, as release assets when a tag v* is pushed.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Python 3.12 (Ubuntu 24.04's own)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends python3.12 python3.12-venv
          python3.12 --version

      - name: Build the bundle
        run: scripts/bundle/build-bundle.sh python3.12

      - name: Test suites against the bundle (make test-bundle)
        run: make test-bundle

      - name: Install the bundle offline in a blank ubuntu:24.04 container
        run: scripts/bundle/test-install.sh dist/bigchaindb-node-*-ubuntu24.04-amd64.tar.gz

      - name: Tag matches the bundle version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(python3.12 -c "exec(open('bigchaindb/bigchaindb/version.py').read()); print(__version__)")
          [[ "${GITHUB_REF_NAME#v}" == "$version" ]] || { echo "tag $GITHUB_REF_NAME but version.py says $version" >&2; exit 1; }
          [[ -f "dist/bigchaindb-node-$version-ubuntu24.04-amd64.tar.gz" ]] || { echo "no bundle named for $version in dist/" >&2; ls dist; exit 1; }
          tar -xzOf "dist/bigchaindb-node-$version-ubuntu24.04-amd64.tar.gz" "bigchaindb-node-$version-ubuntu24.04-amd64/BUNDLE" | grep -qx "version=$version"

      - uses: actions/upload-artifact@v4
        with:
          name: bigchaindb-node-bundle
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # Only the publish job may write to the repository. gh release create fails if the release
  # already exists: a re-tag never replaces published assets.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bigchaindb-node-bundle
          path: dist
      - name: Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md dist/*.tar.gz dist/*.sha256
